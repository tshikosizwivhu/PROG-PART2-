name: Part 2 - Build and Test API

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Part2-API/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.sln --configuration Release --no-build --verbosity normal
